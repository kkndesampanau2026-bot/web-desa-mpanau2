# Templat konfigurasi nginx. __PORT__ diganti entrypoint dengan $PORT yang
# diberikan Railway. Substitusi memakai sed, bukan envsubst, agar variabel
# nginx sendiri ($uri, $query_string, ...) tidak ikut tergantikan.

user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;

    # Impor CSV Kependudukan dibatasi 10MB di sisi aplikasi; batas di sini
    # dibuat sedikit lebih longgar agar penolakan datang dari validasi Laravel
    # (yang pesannya informatif), bukan dari nginx (yang hanya 413 polos).
    client_max_body_size 20M;
    client_body_timeout  120s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    server {
        listen __PORT__;
        listen [::]:__PORT__;
        server_name _;

        root  /var/www/html/public;
        index index.php;
        charset utf-8;

        # Semua rute ditangani Laravel; berkas statis (hasil build Vite dan
        # unggahan di /storage) dilayani langsung oleh nginx.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Aset ber-hash dari Vite aman di-cache selamanya.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;
            fastcgi_param HTTPS           $http_x_forwarded_proto;
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Berkas tersembunyi tidak pernah dilayani — kecuali /.well-known,
        # yang dipakai verifikasi domain.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
