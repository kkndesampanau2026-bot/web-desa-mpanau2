; Penyetelan PHP untuk produksi.

expose_php = Off
memory_limit = 512M
max_execution_time = 120

; Unggahan terbesar adalah CSV Kependudukan (dibatasi 10MB oleh validasi
; Laravel) dan lampiran pengaduan. Batas PHP dibuat sedikit di atasnya.
upload_max_filesize = 12M
post_max_size = 15M
max_file_uploads = 20

date.timezone = Asia/Makassar

; Galat ditulis ke stderr agar tertangkap panel log Railway, tidak pernah
; ditampilkan ke pengunjung.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Kode tidak pernah berubah di dalam citra, jadi pengecekan timestamp hanya
; membuang syscall.
opcache.validate_timestamps = 0
