[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize --force-stderr
autostart = true
autorestart = true
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; Pekerja antrean: satu-satunya penggunanya adalah notifikasi Telegram Surat
; Pengantar. --max-time membuat proses berakhir tiap jam dan dijalankan ulang
; supervisor, cara baku menahan kebocoran memori pada worker berumur panjang.
[program:queue]
command = php /var/www/html/artisan queue:work --tries=3 --backoff=10 --sleep=3 --max-time=3600
user = www-data
autostart = true
autorestart = true
priority = 30
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
